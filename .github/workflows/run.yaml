name: TimeMachine
on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '**/README.md'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev
    steps:
      - name: Dependencies
        run: |
          apk add clang build-base automake autoconf zlib-dev python3 zip curl unzip sudo gcc g++

      - name: Cloning and Building lastest pspsdk
        run: |
          git clone https://github.com/pspdev/pspsdk

      - name: Bootstrap sdk and build
        working-directory: pspsdk
        run: |
          ./build-and-install.sh

      - name: Clone psp-cfw-sdk custom branch
        run: |
          git clone -b bootloadex_tmhlpr --single-branch https://github.com/pspdev/psp-cfw-sdk.git

      - name: Build psp-cfw-sdk
        working-directory: psp-cfw-sdk
        run: |
          make
          sudo make install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build
        run: |
          make

      - name: Compress
        run: |
          cd dist
          zip -r ../TM.zip .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tm-release
          path: TM.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: tm-release
          path: .
      - name:
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: TM Release
          files: TM.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
